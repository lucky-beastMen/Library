<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athenaeum</title>
    <link rel="icon" type="image/png" href="pictures/image-removebg-preview.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body style="color: white">
    <header>
        <h1>Your Books</h1>
        <div class="buttons">
            <div class="search-div">
                <input type="search" name="" id="" placeholder=" Search books...">
            </div>
            <div class="button-div">
                <button id="add-button" class="add-button"><span class="plus-sign">+</span> Add Book</button>
            </div>
        </div>
    </header>
    <main></main>
    <aside>
        <section>
            <div class="side-header">
                <img src="pictures/books-shelf-neon-sign-various-colorful-row-shelf-night-bright-advertisementn.png" alt="book-icon">
                <h1>Athenaeum</h1>
            </div>
            <div class="toggle-options">
                <div class="toggle-all-books">
                    <img src="pictures/wmremove-transformed (1).png" alt="layout template">
                    <p>All My Books</p>
                </div>
                <hr>
                <div class="toggle-read-books">
                    <img src="pictures/neon-green-check-mark-sign-brick-wall.png" alt="tick icon">
                    <p>Read</p>
                </div>
                <hr>
                <div class="toggle-unread-books">
                    <img src="icons/circle.png" alt="clock icon">
                    <p>Unread</p>
                </div>
            </div>
        </section>
        <section class="overview">
            <p>Overview</p>
            <div class="overview-info">
                <div class="total-book-info">
                    <img src="icons/library-big.png" alt="stack of books" class="over-img">
                    <p class="over-p">Total Books</p>
                    <p class="over-total-count">0</p>
                </div>
                <hr>
                <div class="read-info">
                    <img src="icons/circle-check-big (1).png" alt="tick icon" class="over-img">
                    <p class="over-p">Read</p>
                    <p class="over-read-count">0</p>
                </div>
                <hr>
                <div class="unread-info">
                    <img src="icons/circle.png" alt="circle/unchecked icon" class="over-img">
                    <p class="over-p">Unread</p>
                    <p class="over-unread-count">0</p>
                </div>
            </div>
        </section>
        <section class="footer">
            <p>Copyright <img src="icons/copyright (1).png" alt="copyright icon"> hyper_21</p>
        </section>
    </aside>
    <div class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-text-header">
                    <div class="card-img-holder">
                        <img src="pictures/bg-removed-book-icon.png" alt="">
                    </div>
                    <div class="card-header-text">
                        <h2>Add New Book</h2>
                        <p>Fill in the information below</p>
                    </div>
                </div>
                <div class="modal-close-button-holder">
                    <button class="modal-close-button">&times;</button>
                </div>
            </div>
            <hr class="modal-hr">
            <div class="modal-form-holder">
                <form action="" class="modal-form">
                    <div class="modal-title-input-holder">
                        <label for="book-name-input">Title</label>
                        <input type="text" placeholder="Enter Book Title" id="book-name-input" required>
                    </div>
                    <div class="modal-author-input-holder">
                        <label for="author-name-input">Author</label>
                        <input type="text" placeholder="Enter author name" id="author-name-input" required>
                    </div>
                    <div class="modal-page-input-holder">
                        <label for="page-input">Pages</label>
                        <input type="number" placeholder="000" id="page-input" required>
                    </div>
                    <div class="modal-status-holder">
                        <p>Read Status</p>
                        <div class="modal-radio-input-holder">
                            <div class="modal-read-radio-holder">
                                <label for="read-status-input">Read</label>
                                <input type="radio" name="status-input" id="read-status-input" value="read" required>
                            </div>
                            <div class="modal-unread-radio-holder">
                                <label for="unread-status-input">Unread</label>
                                <input type="radio" name="status-input" id="unread-status-input" value="unread" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-buttons-holder">
                        <button class="modal-cancel-button modal-button" type="button">Cancel</button>
                        <button class="modal-add-button modal-button" type="submit">Add Book</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
   
</body>
</html>
