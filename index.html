<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athenaeum</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body style="color: white">
    <header>
        <h1>Your Books</h1>
        <div class="buttons">
            <div class="search-div">
                <input type="search" name="" id="" placeholder=" Search books...">
            </div>
            <div class="button-div">
                <button id="add-button" class="add-button"><span class="plus-sign">+</span> Add Book</button>
            </div>
        </div>
    </header>
    <main>
         
    </main>
    <aside>
        <section>
            <div class="side-header">
                <img src="pictures/books-shelf-neon-sign-various-colorful-row-shelf-night-bright-advertisementn.png" alt="book-icon">
                <h1>Athenaeum</h1>
            </div>
            <div class="toggle-options">
                <div class="toggle-all-books">
                    <img src="pictures/wmremove-transformed (1).png" alt="layout template">
                    <p>All My Books</p>
                </div>
                <hr>
                <div class="toggle-read-books">
                    <img src="pictures/neon-green-check-mark-sign-brick-wall.png" alt="tick icon">
                    <p>Read</p>
                </div>
                <hr>
                <div class="toggle-unread-books">
                    <img src="icons/circle.png" alt="clock icon">
                    <p>Unread</p>
                </div>
            </div>
        </section>
        <section class="overview">
            <p>Overview</p>
            <div class="overview-info">
                <div class="total-book-info">
                    <img src="icons/library-big.png" alt="stack of books" class="over-img">
                    <p class="over-p">Total Books</p>
                    <p class="over-count">0</p>
                </div>
                <hr>
                <div class="read-info">
                    <img src="icons/circle-check-big (1).png" alt="tick icon" class="over-img">
                    <p class="over-p">Read</p>
                    <p class="over-count">0</p>
                </div>
                <hr>
                <div class="unread-info">
                    <img src="icons/circle.png" alt="circle/unchecked icon" class="over-img">
                    <p class="over-p">Unread</p>
                    <p class="over-count">0</p>
                </div>
            </div>
        </section>
        <section class="footer">
            <p>Copyright <img src="icons/copyright (1).png" alt="copyright icon"> hyper_21</p>
        </section>
    </aside>

   
</body>
</html>
