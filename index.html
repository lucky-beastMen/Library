<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athenaeum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="color: white">
    <header>
        <h1>Your Books</h1>
        <div class="buttons">
            <div class="search-div">
                <input type="search" name="" id="" placeholder=" Search books...">
            </div>
            <div class="button-div">
                <button class="add-button"><span class="plus-sign">+</span> Add Book</button>
            </div>
        </div>
    </header>
    <main>
        <h2>No Books Added</h2>
    </main>
    <aside>
        <section>
            <div class="side-header">
                <img src="icons/book-open.png" alt="book-icon">
                <h1>Athenaeum</h1>
            </div>
            <div class="toggle-options">
                <div class="toggle-all-books">
                    <img src="icons/layout-template.png" alt="layout template">
                    <p>All My Books</p>
                </div>
                <hr>
                <div class="toggle-read-books">
                    <img src="icons/circle-check-big (1).png" alt="tick icon">
                    <p>Read</p>
                </div>
                <hr>
                <div class="toggle-unread-books">
                    <img src="icons/clock.png" alt="clock icon">
                    <p>Unread</p>
                </div>
            </div>
        </section>
        <section class="overview">
            <h2>Overview</h2>
            <div class="overview-info">
                <div class="total-book info">
                    <img src="icons/library-big.png" alt="stack of books">
                    <p>Total Books</p>
                    <p>0</p>
                </div>
                <div class="read-info">
                    <img src="icons/circle-check-big (1).png" alt="tick icon">
                    <p>Read</p>
                    <p>0</p>
                </div>
                <div class="unread-info">
                    <img src="icons/circle.png" alt="circle/unchecked icon">
                    <p>Unread</p>
                    <p>0</p>
                </div>
            </div>
        </section>
        <section class="footer">
            <p>Copyright <img src="icons/copyright.png" alt="copyright icon"> hyper_21</p>
        </section>
    </aside>

</body>
</html>
